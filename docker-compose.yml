services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kinerja
    ports:
      - "5432:5432"
    volumes:
      - kinerja_pg_data:/var/lib/postgresql/data

volumes:
  kinerja_pg_data:
