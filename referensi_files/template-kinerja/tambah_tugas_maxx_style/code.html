<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Tambah Tugas</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#e7eefe",
                        "tertiary-container": "#a2a6a5",
                        "on-surface": "#151c27",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#ffdcc6",
                        "on-tertiary-fixed-variant": "#434847",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#ffb784",
                        "background": "#f9f9ff",
                        "on-primary-fixed-variant": "#713700",
                        "on-secondary-container": "#495681",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#e0e3e2",
                        "tertiary": "#5b5f5f",
                        "primary-fixed-dim": "#ffb784",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#c0cdff",
                        "surface-bright": "#f9f9ff",
                        "secondary-fixed": "#dbe1ff",
                        "on-surface-variant": "#574335",
                        "on-primary-container": "#5f2e00",
                        "surface-container-low": "#f0f3ff",
                        "surface-container-high": "#e2e8f8",
                        "on-background": "#151c27",
                        "secondary": "#4f5d88",
                        "on-secondary-fixed-variant": "#38456f",
                        "on-secondary-fixed": "#091941",
                        "error-container": "#ffdad6",
                        "surface-tint": "#944a00",
                        "inverse-on-surface": "#ebf1ff",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#301400",
                        "surface-container-highest": "#dce2f3",
                        "on-tertiary-container": "#383c3b",
                        "surface-variant": "#dce2f3",
                        "tertiary-fixed-dim": "#c4c7c6",
                        "surface": "#f9f9ff",
                        "on-tertiary-fixed": "#181c1c",
                        "surface-dim": "#d3daea",
                        "secondary-fixed-dim": "#b7c5f6",
                        "primary-container": "#ff8400",
                        "error": "#ba1a1a",
                        "inverse-surface": "#2a313d",
                        "primary": "#944a00",
                        "outline": "#8b7262",
                        "outline-variant": "#dec1af",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "32px",
                        "sm": "16px",
                        "md": "24px",
                        "margin-mobile": "20px",
                        "base": "4px",
                        "xl": "48px",
                        "gutter": "16px",
                        "xs": "8px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-lg": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-lg": ["14px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-background antialiased min-h-screen pb-24 md:pb-0 pt-16">
<!-- TopAppBar -->
<header class="bg-secondary dark:bg-inverse-surface fixed top-0 left-0 w-full z-50 shadow-md flex justify-between items-center px-margin-mobile h-16" style="background-color: rgb(29, 43, 83);">
<button class="hover:opacity-80 transition-opacity active:scale-95 duration-100 flex items-center justify-center p-2 rounded-full text-white">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="text-headline-sm font-headline-sm font-bold text-white">Staff Performance</h1>
<button class="hover:opacity-80 transition-opacity active:scale-95 duration-100 flex items-center justify-center p-2 rounded-full text-white">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<main class="max-w-screen-md mx-auto px-margin-mobile pt-sm md:pt-lg">
<div class="mb-lg">
<h2 class="text-headline-md font-headline-md text-on-surface mb-base">Tambah Tugas</h2>
<p class="text-body-md font-body-md text-on-surface-variant">Isi detail tugas baru yang akan dilaporkan.</p>
</div>
<form class="space-y-md bg-surface-container-lowest rounded-[20px] p-sm md:p-md shadow-[0_4px_12px_0_rgba(0,0,0,0.04)]">
<!-- Title Input -->
<div class="space-y-xs">
<label class="block text-label-lg font-label-lg text-on-surface" for="taskTitle">Judul Tugas</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 text-body-lg font-body-lg text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="taskTitle" placeholder="Masukkan judul tugas" type="text">
</div>
<!-- Details Textarea -->
<div class="space-y-xs">
<label class="block text-label-lg font-label-lg text-on-surface" for="taskDetails">Detail Tugas</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 text-body-lg font-body-lg text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors resize-none" id="taskDetails" placeholder="Deskripsikan detail tugas..." rows="4"></textarea>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Date Input -->
<div class="space-y-xs">
<label class="block text-label-lg font-label-lg text-on-surface" for="taskDate">Tanggal</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-4 pr-10 py-3 text-body-lg font-body-lg text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors appearance-none" id="taskDate" type="date">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="calendar_month">calendar_month</span>
</div>
</div>
<!-- Sub-activity Dropdown -->
<div class="space-y-xs">
<label class="block text-label-lg font-label-lg text-on-surface" for="subActivity">Sub Aktivitas</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-4 pr-10 py-3 text-body-lg font-body-lg text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors appearance-none" id="subActivity">
<option disabled="" selected="" value="">Pilih aktivitas</option>
<option value="1">Kunjungan Klien</option>
<option value="2">Meeting Internal</option>
<option value="3">Penyusunan Laporan</option>
<option value="4">Lainnya</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Action Blocks (Photo & Location) -->
<div class="grid grid-cols-2 gap-sm pt-sm">
<button class="flex flex-col items-center justify-center p-md border border-outline-variant rounded-xl bg-surface hover:bg-surface-container-low transition-colors active:scale-95 duration-200" type="button">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center mb-xs">
<span class="material-symbols-outlined text-on-secondary-container" data-icon="photo_camera" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
<span class="text-label-lg font-label-lg text-on-surface">Ambil Foto</span>
<span class="text-label-sm font-label-sm text-on-surface-variant mt-1">Wajib (Max 5MB)</span>
</button>
<button class="flex flex-col items-center justify-center p-md border border-outline-variant rounded-xl bg-surface hover:bg-surface-container-low transition-colors active:scale-95 duration-200" type="button">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center mb-xs">
<span class="material-symbols-outlined text-on-secondary-container" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<span class="text-label-lg font-label-lg text-on-surface">Tag Lokasi</span>
<span class="text-label-sm font-label-sm text-on-surface-variant mt-1">Sesuai GPS saat ini</span>
</button>
</div>
<!-- Submit Button -->
<div class="pt-md">
<button class="w-full bg-primary-container text-on-primary-container rounded-[16px] py-4 text-headline-sm font-headline-sm hover:opacity-90 transition-opacity active:scale-95 duration-200 shadow-sm" type="submit">
                    Simpan Tugas
                </button>
</div>
</form>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface-container-lowest dark:bg-surface-dim fixed bottom-0 left-0 w-full z-50 border-t border-outline-variant dark:border-outline shadow-[0_-4px_12px_0_rgba(0,0,0,0.04)] flex justify-around items-center h-20 px-2 pb-safe md:hidden rounded-t-lg">
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1 hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:scale-90 duration-200 rounded-lg">
<span class="material-symbols-outlined mb-1" data-icon="dashboard">dashboard</span>
<span class="font-label-sm text-label-sm">Mandiri</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1 hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:scale-90 duration-200 rounded-lg">
<span class="material-symbols-outlined mb-1" data-icon="groups">groups</span>
<span class="font-label-sm text-label-sm">Pimpinan</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1 hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:scale-90 duration-200 rounded-lg">
<span class="material-symbols-outlined mb-1" data-icon="leaderboard">leaderboard</span>
<span class="font-label-sm text-label-sm">Board</span>
</button>
<!-- Active Tab - Laporan -->
<button class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary px-4 py-1 hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:scale-90 duration-200 rounded-lg">
<span class="material-symbols-outlined mb-1" data-icon="assessment" style="font-variation-settings: 'FILL' 1;">assessment</span>
<span class="font-label-sm text-label-sm font-bold">Laporan</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1 hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:scale-90 duration-200 rounded-lg">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</nav>


</body></html>
